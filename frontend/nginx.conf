# 站点配置，拷进 /etc/nginx/conf.d/default.conf（覆盖镜像自带的那份）。
#
# 站点必须挂在**根路径**：dist/index.html 里引用的是 /assets/... 这类根绝对路径，
# 路由用的是 createWebHistory()。将来要改挂子路径，必须同时给前端构建加 `base`，
# 只改这个文件不够。
#
# 不在此处终止 TLS —— 当前部署是 IP + HTTP（见 deploy.md 的「已知并接受的风险」）。

server {
    # 容器内固定监听 80；对外的 82 是 docker-compose.yml 里的宿主机侧映射
    # （`${HTTP_PORT:-82}:80`），别把这里改成 82。
    #
    # 两行都写：官方镜像的 entrypoint 脚本（10-listen-on-ipv6-by-default.sh）
    # 本来是负责给**原厂** default.conf 补 IPv6 监听的，我们用自己这份覆盖了它，
    # 所以这行得自己补。该脚本已在 frontend/Dockerfile 里删除（见那边的注释）。
    listen 80;
    listen [::]:80;

    server_name _;

    # 上传上限。后端 MAX_FILE_SIZE_MB=10（10*1024*1024 字节），而 nginx 默认只有 1m：
    # 不改的话 10MB 的文件在这里就被 413 拦掉，请求根本到不了 FastAPI ——
    # 用户看不到前端那句「文件大小超过限制」的中文提示，只拿到一页 nginx 的 HTML 报错。
    #
    # 用 12m 而不是 10m：multipart 请求体还要额外算 boundary 与 Content-Disposition
    # 头部开销，卡着 10m 会让「正好 10MiB 的文件」在边界上被误杀。
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    # 文件名带内容 hash，内容一变文件名就变，可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 绝不能缓存：重新部署后，用户浏览器里旧 HTML 会去请求已经被删掉的
    # 旧 hash 资源，表现是白屏，而且刷新也未必好（强缓存）。
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /favicon.svg {
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA 回退：/chat、/documents 这些前端路由在服务端并不存在对应文件，直接刷新
    # 会 404，必须回落到 index.html 交给 vue-router 处理。
    #
    # 刻意**不写 `$uri/`** —— 那会让 /assets 这类请求命中 nginx 的目录重定向逻辑，
    # 产生 301 循环。
    location / {
        try_files $uri /index.html;
    }

    # 后端接口。POST /api/chat 是 SSE、上传是 multipart，都走这个 location。
    #
    # 注意 **proxy_pass 结尾不带斜杠**：后端路由本来就挂在 /api 下，
    # 带尾斜杠会把 /api 前缀剥掉，请求全部 404。
    location /api/ {
        proxy_pass http://backend:8000;

        # SSE 需要 HTTP/1.1
        proxy_http_version 1.1;

        # 不缓冲。后端已经在这个 StreamingResponse 上发了 `X-Accel-Buffering: no`
        # （app/api/chat.py），nginx 会因此对那条响应关闭缓冲；这里再显式写一遍，
        # 免得以后换代理层或改后端时踩空 —— 缓冲了就拿不到逐字输出。
        proxy_buffering off;
        proxy_cache off;

        # 显式关 gzip。默认就是 off，写出来是为了挡住后人「图省事开个全局 gzip
        # 省流量」：gzip 模块自己的缓冲区会把 SSE 攒成大块再吐，
        # 表现是「回答不是逐字出现，而是整段蹦出来」，而且很难联想到 gzip。
        gzip off;

        # 用 `Connection ""` 而不是 `keep-alive`：后者会原样透传给上游造成歧义，
        # 由 nginx 自己管理到上游的连接即可。
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长回答（LLM 逐字流式）和 10MB 上传都可能超过默认的 60s，
        # 不改会在生成中途被 nginx 掐断连接。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
